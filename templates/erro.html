{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block corpo %}
<div class="entrada"><div class="caixa-entrada" style="text-align:center">
  <div class="logo"><img src="{{ url_for('static', filename='logo.svg') }}" alt=""><span><b>Just</b><span>Plan</span></span></div>
  <div class="cartao" style="display:flex;flex-direction:column;gap:10px;align-items:center">
    <div style="font-size:48px;font-weight:800;color:#0D5C2A">{{ codigo }}</div>
    <h1 style="color:#10271A;font-size:26px">{{ titulo }}</h1>
    <p style="margin:0;color:#4F6153">{{ texto }}</p>
    <a class="botao" style="text-decoration:none;display:inline-flex;align-items:center" href="{{ url_for('inicio') }}">Voltar ao início</a>
  </div>
</div></div>
{% endblock %}
