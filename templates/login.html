{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block corpo %}
<div class="entrada"><div class="caixa-entrada">
  <div class="logo"><img src="{{ url_for('static', filename='logo.svg') }}" alt=""><span><b>Just</b><span>Plan</span></span></div>
  <div class="cartao">
    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      {% for m in get_flashed_messages() %}<div class="aviso">{{ m }}</div>{% endfor %}
      <label class="campo">E-mail<input type="email" name="email" required autocomplete="username" autofocus></label>
      <label class="campo">Senha<input type="password" name="senha" required autocomplete="current-password"></label>
      <button class="botao">Entrar</button>
    </form>
  </div>
  <div class="troca">Recebeu um código de convite? <a href="{{ url_for('cadastro') }}">Criar conta</a></div>
</div></div>
{% endblock %}
