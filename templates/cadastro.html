{% extends "base.html" %}
{% block titulo %}Criar conta{% endblock %}
{% block corpo %}
<div class="entrada"><div class="caixa-entrada">
  <div class="logo"><img src="{{ url_for('static', filename='logo.svg') }}" alt=""><span><b>Just</b><span>Plan</span></span></div>
  <div class="cartao">
    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      {% for m in get_flashed_messages() %}<div class="aviso">{{ m }}</div>{% endfor %}
      <label class="campo">Código de convite<input name="codigo" required placeholder="XXXX-XXXX-XXXX" value="{{ request.form.codigo }}" style="text-transform: uppercase; letter-spacing: 0.08em"></label>
      <label class="campo">Nome<input name="nome" required value="{{ request.form.nome }}"></label>
      <label class="campo">E-mail<input type="email" name="email" required autocomplete="username" value="{{ request.form.email }}"></label>
      <label class="campo">Senha (mín. 8 caracteres)<input type="password" name="senha" required minlength="8" autocomplete="new-password"></label>
      <label class="campo">Repita a senha<input type="password" name="senha2" required minlength="8" autocomplete="new-password"></label>
      <button class="botao">Criar conta</button>
    </form>
  </div>
  <div class="troca">Já tem conta? <a href="{{ url_for('login') }}">Entrar</a></div>
</div></div>
{% endblock %}
